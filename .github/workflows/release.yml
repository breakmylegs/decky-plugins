name: release

# Tag format: <plugin-id>-v<semver>, for example qbittorrent-monitor-v0.1.0.
# Builds the zip, pushes the plugin folder (with vendored shared code) to its
# mirror repo, and creates a release on the mirror with the zip attached.
#
# Needs the repository secret MIRROR_TOKEN: a fine-grained token with
# contents: write on the three mirror repos. The mirror owner defaults to this
# repo's owner. Set the repository variable MIRROR_OWNER to override.

on:
  push:
    tags: ["*-v*.*.*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      MIRROR_OWNER: ${{ vars.MIRROR_OWNER || github.repository_owner }}
    steps:
      - uses: actions/checkout@v7

      - name: Parse tag
        id: tag
        run: |
          tag="${GITHUB_REF_NAME}"
          plugin="${tag%-v*}"
          version="${tag##*-v}"
          if [ ! -f "plugins/${plugin}/plugin.json" ]; then
            echo "No plugin named ${plugin}" >&2
            exit 1
          fi
          pkg_version=$(python -c "import json;print(json.load(open('plugins/${plugin}/package.json'))['version'])")
          if [ "${pkg_version}" != "${version}" ]; then
            echo "Tag version ${version} does not match package.json ${pkg_version}" >&2
            exit 1
          fi
          echo "plugin=${plugin}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "mirror=${MIRROR_OWNER}/${plugin}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - uses: pnpm/action-setup@v6
        with:
          version: 9
      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Vendor, test, build, package
        env:
          PLUGIN: ${{ steps.tag.outputs.plugin }}
        run: |
          pip install pytest
          python tools/vendor_shared.py "$PLUGIN" --owner "$MIRROR_OWNER"
          python -m pytest -q shared/py/tests "plugins/$PLUGIN/tests"
          ( cd "plugins/$PLUGIN" && pnpm install --frozen-lockfile && pnpm test && pnpm build && pnpm typecheck )
          python tools/package_zip.py "$PLUGIN" --author "$MIRROR_OWNER"
          python -I tools/smoke_zip.py "out/$PLUGIN.zip"

      - name: Push to mirror
        env:
          MIRROR_TOKEN: ${{ secrets.MIRROR_TOKEN }}
          PLUGIN: ${{ steps.tag.outputs.plugin }}
          VERSION: ${{ steps.tag.outputs.version }}
          MIRROR: ${{ steps.tag.outputs.mirror }}
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          git clone --quiet "https://x-access-token:${MIRROR_TOKEN}@github.com/${MIRROR}.git" "$work/mirror"
          # Replace the mirror's tracked files with the plugin folder.
          find "$work/mirror" -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          rsync -a --exclude node_modules --exclude dist --exclude out --exclude __pycache__ \
            "plugins/$PLUGIN/" "$work/mirror/"
          cp LICENSE "$work/mirror/LICENSE"
          cd "$work/mirror"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit --quiet -m "Release ${PLUGIN} ${VERSION} from ${GITHUB_REPOSITORY}@${GITHUB_SHA::7}" || echo "No file changes"
          git tag -f "v${VERSION}"
          git push --quiet origin HEAD:main
          git push --quiet --force origin "v${VERSION}"

      - name: Create mirror release
        env:
          GH_TOKEN: ${{ secrets.MIRROR_TOKEN }}
          PLUGIN: ${{ steps.tag.outputs.plugin }}
          VERSION: ${{ steps.tag.outputs.version }}
          MIRROR: ${{ steps.tag.outputs.mirror }}
        run: |
          gh release create "v${VERSION}" "out/${PLUGIN}.zip" \
            --repo "$MIRROR" \
            --title "${PLUGIN} ${VERSION}" \
            --notes "Install: Decky Settings, Developer, Install Plugin from URL, then enter https://github.com/${MIRROR}/releases/latest/download/${PLUGIN}.zip"
