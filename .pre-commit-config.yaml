repos:
  - repo: local
    hooks:
      - id: secret-check
        name: secret pattern check
        entry: python tools/check_secrets.py
        language: system
        pass_filenames: false
      - id: fixture-guard
        name: fixture guard
        entry: python tools/check_fixtures.py
        language: system
        pass_filenames: false
      - id: readonly-guard
        name: tuning-advisor read-only guard
        entry: python tools/check_readonly.py plugins/tuning-advisor
        language: system
        pass_filenames: false
